name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Offline test suite
    runs-on: ubuntu-24.04
    env:
      # Make OCICL resolve only the committed lockfile in this checkout.
      OCICL_LOCAL_ONLY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl

      - name: Install OCICL
        run: |
          git clone --depth 1 --branch v2.16.13 https://github.com/ocicl/ocicl.git /tmp/ocicl
          sbcl --non-interactive --load /tmp/ocicl/setup.lisp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependency and compilation caches
        uses: actions/cache@v4
        with:
          path: |
            ocicl
            ~/.cache/common-lisp
          key: ${{ runner.os }}-sbcl-ocicl-${{ hashFiles('ocicl.csv', 'cl-agent.asd') }}

      - name: Run offline test suite
        run: make test
